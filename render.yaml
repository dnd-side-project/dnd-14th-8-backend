services:
  - type: web
    name: moyeorak-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,render
      - key: DB_JDBC_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: KAKAO_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ODSAY_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
