services:
  - type: web
    name: moyeorak-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    # 새 Blueprint를 만들 때의 참고값이다. 지금 운영 서비스는 이 파일을 읽지 않고(대시보드에서 직접 만든 서비스),
    # GitHub 알림 없이 주소로만 연결돼 있어 머지해도 저절로 배포되지 않는다(docs/render-deployment-verification.md, #182).
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,render
      - key: DB_JDBC_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: KAKAO_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ODSAY_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
