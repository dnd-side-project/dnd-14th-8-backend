services:
  - type: web
    name: moyeorak-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    # 새 Blueprint를 만들 때의 참고값이다. 지금 운영 서비스는 Blueprint가 아니라 이 값이 적용되지 않고,
    # 공개 저장소 주소로 연결돼 자동 배포되지 않는다(docs/render-deployment-verification.md, #182).
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,render
      - key: DB_JDBC_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: KAKAO_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ODSAY_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
